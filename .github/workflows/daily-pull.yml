name: NGX Daily Data Pull

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  pull-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the daily pull script
        env:
          KOBO_KEY: ${{ secrets.KOBO_KEY }}
        run: python daily_update.py

      - name: Run the CBN macro data pull
        run: python cbn_update.py

      - name: Run the NGX own-source data pull
        run: python ngx_own_data_update.py

      - name: Commit and push any new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Automated NGX data pull $(date +'%Y-%m-%d')"
          git push
