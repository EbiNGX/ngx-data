name: NGX Daily Data Pull

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  pull-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the CBN macro data pull
        run: python cbn_update.py

      - name: Run the NGX own-source data pull
        run: python ngx_own_data_update.py

      - name: Bridge free NGX-native price data into per-ticker files
        run: python bridge_price_data.py

      - name: Check for frozen-price dislocations
        run: python dislocation_check.py

      - name: Run the stockanalysis fundamentals pull
        run: python stockanalysis_update.py

      - name: Run the mystocks dividend calendar pull
        run: python mystocks_dividend_calendar.py

      - name: Run the forward screening scan
        run: python forward_screen.py

      - name: Check portfolio call outcomes
        run: python resolve_portfolio_calls.py

      - name: Commit and push any new data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Automated NGX data pull $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
